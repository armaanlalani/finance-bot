{% extends "base.html" %}
{% block title %}Sell Position - Finance Bot{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto fade-in">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-xl font-semibold mb-6">Sell Position</h2>

        <form method="POST" class="space-y-5">
            <div>
                <label for="ticker" class="block text-sm font-medium text-gray-700 mb-1">Ticker Symbol</label>
                <input type="text" name="ticker" id="ticker" required placeholder="e.g. AAPL"
                    class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none uppercase">
            </div>

            <div>
                <label for="account_type" class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
                <select name="account_type" id="account_type"
                    class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none bg-white">
                    {% for acct in account_types %}
                    <option value="{{ acct }}">{{ acct }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="shares" class="block text-sm font-medium text-gray-700 mb-1">Shares to Sell</label>
                <input type="number" name="shares" id="shares" required step="any" min="0.0001" placeholder="e.g. 5"
                    class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
            </div>

            <div>
                <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Sale Price Per Share ($)</label>
                <input type="number" name="price" id="price" required step="any" min="0.01" placeholder="e.g. 195.00"
                    class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                    class="flex-1 bg-red-600 text-white px-4 py-2.5 rounded-lg font-medium text-sm hover:bg-red-700 transition-colors">
                    Sell Shares
                </button>
                <a href="/"
                    class="flex-1 text-center bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg font-medium text-sm hover:bg-gray-200 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
